<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DeWise Systems PLANETARY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DeWise Planetary">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-gold: #ffdf00;
            --neon-magenta: #ff00ff;
            --neon-red: #ff3333;
            --bg-space: #060616;
            --glass-bg: rgba(20, 20, 50, 0.7);
            --glass-border: rgba(0, 243, 255, 0.35);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-space);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- IMMUTABLE TOP LAYER AUDIO TOGGLE --- */
        #audioToggleBtn {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            z-index: 999999 !important;
            background: #00f3ff !important;
            color: #000000 !important;
            border: 3px solid #ffffff !important;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 25px #00f3ff;
            transition: all 0.2s ease;
            pointer-events: auto !important;
        }

        @media (min-width: 768px) {
            #audioToggleBtn { padding: 14px 24px; font-size: 14px; gap: 10px; }
        }

        /* --- UI OVERLAYS --- */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ffffff;
            z-index: 1000;
            background: radial-gradient(circle at center, rgba(15, 15, 45, 0.95) 0%, var(--bg-space) 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .brand-title {
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 900;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
        }

        .brand-subtitle {
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            font-weight: 900;
            letter-spacing: 6px;
            margin: 0 0 30px 0;
            text-transform: uppercase;
            color: var(--neon-cyan);
            text-shadow: 0 0 35px rgba(0, 243, 255, 0.8);
        }

        .btn-modern {
            padding: clamp(14px, 3vw, 18px) clamp(35px, 8vw, 50px);
            font-size: clamp(14px, 2.5vw, 16px);
            font-weight: 700;
            letter-spacing: 3px;
            background: var(--glass-bg);
            color: #fff;
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }

        .btn-modern:hover {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.5);
            transform: translateY(-2px);
        }

        /* --- ADAPTIVE HUD --- */
        #hud {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            background: var(--glass-bg);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #e0e0ff;
            font-family: monospace;
            font-size: clamp(11px, 2vw, 14px);
            z-index: 10;
            pointer-events: none;
            line-height: 1.6;
        }

        .hud-val { color: #fff; font-weight: bold; }

        /* HUD NOTIFICATIONS */
        #gameAlert {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Segoe UI', sans-serif;
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 900;
            letter-spacing: 2px;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* --- CONTROLS --- */
        .control-container {
            position: absolute;
            bottom: max(25px, env(safe-area-inset-bottom));
            left: 0;
            width: 100%;
            padding: 0 max(25px, env(safe-area-inset-left)) 0 max(25px, env(safe-area-inset-right));
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 20;
        }

        .hud-dir-btn {
            width: clamp(65px, 18vw, 85px);
            height: clamp(65px, 18vw, 85px);
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            color: var(--neon-cyan);
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
        }

        .hud-dir-btn svg { width: 45%; height: 45%; }
        .hud-dir-btn:active {
            border-color: #ffffff;
            background: rgba(0, 243, 255, 0.3);
            transform: scale(0.9);
        }

        /* --- iOS EXCLUSIVE DRAWER --- */
        #iosPrompt {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 360px;
            background: rgba(15, 15, 40, 0.95);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
            z-index: 100000;
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        #iosPrompt h3 { margin: 0 0 10px 0; color: var(--neon-cyan); font-size: 16px; }
        #iosPrompt p { margin: 0; font-size: 13px; line-height: 1.5; color: #d0d0f0; }
        #iosPrompt .close-prompt { position: absolute; top: 10px; right: 15px; color: #ff3333; font-weight: bold; cursor: pointer; }

        #gameOverScreen { display: none; }
    </style>
</head>

<body>

    <button id="audioToggleBtn" onclick="toggleMute(event)">
        <span id="audioIcon">🔊</span> <span id="audioText">SOUND: ON</span>
    </button>

    <div id="menuScreen" class="screen-overlay" onclick="handleMenuInteraction()">
        <div class="brand-title">DeWise Systems</div>
        <div class="brand-subtitle">PLANETARY</div>
        <button class="btn-modern" onclick="startGame(event)">LAUNCH ENGINE</button>
    </div>

    <div id="hud">
        <span style="color:var(--neon-cyan)">⚡ DE-WISE OS v7.0</span><br>
        Score: <span id="score" class="hud-val">0</span><br>
        Velocity: <span id="speed" class="hud-val">0</span> km/s<br>
        Record: <span id="highScore" class="hud-val">0</span>
    </div>

    <div id="gameAlert"></div>

    <div class="control-container">
        <button id="leftBtn" class="hud-dir-btn" aria-label="Steer Left">
            <svg viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <button id="rightBtn" class="hud-dir-btn" aria-label="Steer Right">
            <svg viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <div id="gameOverScreen" class="screen-overlay">
        <div class="brand-title" style="color: var(--neon-red)">System Alert</div>
        <h1 style="text-shadow: 0 0 30px rgba(255, 51, 51, 0.4); font-size: 2.2rem;">CRITICAL COLLISION</h1>
        <button class="btn-modern" style="border-color: var(--neon-red);" onclick="restartGame()">RE-MATERIALIZE</button>
    </div>

    <div id="iosPrompt">
        <span class="close-prompt" onclick="document.getElementById('iosPrompt').style.display='none'">✕</span>
        <h3>Install DeWise Planetary</h3>
        <p>Tap the <strong>Share</strong> icon in Safari, then select <strong>"Add to Home Screen"</strong> to run directly as a full-screen app.</p>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA ServiceWorker Active.'))
                .catch(err => console.error('ServiceWorker failure.', err));
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone === true;
        if (isIos && !isStandalone) {
            document.getElementById('iosPrompt').style.display = 'block';
        }
    });

    let scene, camera, renderer, playerShip;
    let gameRunning = false;
    let speed = 0.25;
    const baseSpeed = 0.25;
    let gameScore = 0;
    let highScore = Number(localStorage.getItem("dewiseHighScore")) || 0;
    let gameObjects = [];
    const lanes = [-2.5, 0, 2.5];
    let moveLeft = false, moveRight = false;
    let spawnIntervalId;

    // --- AUDIO CONTROLLER ENGINE ---
    let isMuted = false;
    let audioCtx = null;
    let audioInitialized = false;

    // Custom File Objects Linked to Root Variables
    const startingMusic = new Audio('starting.mp3');
    const gameplayMusic = new Audio('theme.wav');
    startingMusic.loop = true;
    gameplayMusic.loop = true;

    function initAudio() {
        if (audioInitialized) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioInitialized = true;
    }

    function handleMenuInteraction() {
        initAudio();
        if (!gameRunning && startingMusic.paused && !isMuted) {
            startingMusic.play().catch(e => console.log("Audio pipeline awaiting user interaction element."));
        }
    }

    function playSynthSound(type) {
        if (isMuted || !audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        
        if (type === 'booster') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        } 
        else if (type === 'reducer') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.25);
        } 
        else if (type === 'crash') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.5);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.5);
        }
    }

    function toggleMute(event) {
        if(event) event.stopPropagation();
        initAudio();
        isMuted = !isMuted;
        
        startingMusic.muted = isMuted;
        gameplayMusic.muted = isMuted;
        
        const btn = document.getElementById("audioToggleBtn");
        const icon = document.getElementById("audioIcon");
        const text = document.getElementById("audioText");
        
        if (isMuted) {
            icon.innerText = "✕";
            text.innerText = "SOUND: MUTED";
            btn.style.setProperty("background", "#ff3333", "important");
            btn.style.setProperty("box-shadow", "0 0 30px #ff3333", "important");
        } else {
            icon.innerText = "🔊";
            text.innerText = "SOUND: ON";
            btn.style.setProperty("background", "#00f3ff", "important");
            btn.style.setProperty("box-shadow", "0 0 30px #00f3ff", "important");
            if (gameRunning) {
                gameplayMusic.play().catch(()=>{});
            } else {
                startingMusic.play().catch(()=>{});
            }
        }
    }

    function triggerAlert(text, color) {
        const alertDiv = document.getElementById("gameAlert");
        alertDiv.innerText = text;
        alertDiv.style.color = color;
        alertDiv.style.textShadow = `0 0 15px ${color}`;
        alertDiv.style.opacity = "1";
        setTimeout(() => { alertDiv.style.opacity = "0"; }, 800);
    }
    
    // --- THREE.JS LAYER ---
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a20);
        scene.fog = new THREE.FogExp2(0x0a0a20, 0.012);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x666699));
        const keyLight = new THREE.DirectionalLight(0xffffff, 1.8);
        keyLight.position.set(5, 20, 10);
        scene.add(keyLight);

        const shipGeo = new THREE.ConeGeometry(0.35, 1.6, 4); 
        shipGeo.rotateX(Math.PI / 2);
        const shipMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x004466, metalness: 0.8 });
        playerShip = new THREE.Mesh(shipGeo, shipMat);
        playerShip.position.set(0, 0.5, 0);
        scene.add(playerShip);

        const starsGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(300 * 3);
        for(let i=0; i<300*3; i+=3) {
            starPositions[i] = (Math.random() - 0.5) * 140;
            starPositions[i+1] = (Math.random() - 0.5) * 140;
            starPositions[i+2] = (Math.random() - 1) * 200;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.4});
        scene.add(new THREE.Points(starsGeo, starsMat));

        document.getElementById("highScore").innerText = highScore;
        setupControls();
        window.addEventListener("resize", onResize);
        animate();
    }

    function setupControls() {
        const leftBtn = document.getElementById("leftBtn"), rightBtn = document.getElementById("rightBtn");
        
        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); moveLeft = true; });
        leftBtn.addEventListener("touchend", (e) => { e.preventDefault(); moveLeft = false; });
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); moveRight = true; });
        rightBtn.addEventListener("touchend", (e) => { e.preventDefault(); moveRight = false; });
        
        document.addEventListener("keydown", (e) => {
            initAudio();
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") moveLeft = true;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") moveRight = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") moveLeft = false;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") moveRight = false;
        });
    }

    function spawnEntity() {
        if (!gameRunning) return;
        const randType = Math.random();
        let objGeo, objMat, typeName, size = 0.4;

        if (randType < 0.45) {
            typeName = "planet"; size = 0.6 + Math.random() * 0.6;
            objGeo = new THREE.SphereGeometry(size, 16, 16);
            objMat = new THREE.MeshStandardMaterial({ color: 0xff5733, roughness: 0.7 });
        } else if (randType < 0.75) {
            typeName = "booster"; size = 0.3;
            objGeo = new THREE.OctahedronGeometry(size, 0);
            objMat = new THREE.MeshStandardMaterial({ color: 0xffdf00, metalness: 0.9, emissive: 0x443300 });
        } else {
            typeName = "reducer"; size = 0.3;
            objGeo = new THREE.BoxGeometry(size, size, size);
            objMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, metalness: 0.5, emissive: 0x330033 });
        }

        const mesh = new THREE.Mesh(objGeo, objMat);
        mesh.position.set(lanes[Math.floor(Math.random() * 3)], 0.5, playerShip.position.z - 75);
        mesh.userData = { type: typeName, radius: size, rotSpeed: 0.03 };
        scene.add(mesh);
        gameObjects.push(mesh);
    }

    function animate() {
        requestAnimationFrame(animate);
        if (gameRunning) {
            playerShip.position.z -= speed;
            speed += 0.00002;

            gameScore = Math.floor(Math.abs(playerShip.position.z) * 0.5);
            document.getElementById("score").innerText = gameScore;
            document.getElementById("speed").innerText = Math.floor(speed * 320);

            if (moveLeft && playerShip.position.x > -2.6) playerShip.position.x -= 0.18;
            if (moveRight && playerShip.position.x < 2.6) playerShip.position.x += 0.18;

            for (let i = gameObjects.length - 1; i >= 0; i--) {
                let obj = gameObjects[i];
                obj.rotation.y += obj.userData.rotSpeed;
                obj.rotation.x += 0.01;
                
                if (obj.position.z > playerShip.position.z + 10) { 
                    scene.remove(obj); 
                    gameObjects.splice(i, 1); 
                    continue; 
                }
                
                if (playerShip.position.distanceTo(obj.position) < (obj.userData.radius + 0.4)) {
                    if (obj.userData.type === "planet") { 
                        handleGameOver(); 
                        return; 
                    } else if (obj.userData.type === "booster") {
                        speed = Math.min(speed + 0.08, 0.8);
                        playSynthSound('booster');
                        triggerAlert("BOOST! SPEED UP", "var(--neon-gold)");
                    } else if (obj.userData.type === "reducer") {
                        speed = Math.max(speed - 0.06, baseSpeed);
                        playSynthSound('reducer');
                        triggerAlert("REDUCER! VELOCITY DROP", "var(--neon-magenta)");
                    }
                    scene.remove(obj); 
                    gameObjects.splice(i, 1);
                }
            }
        }
        
        camera.position.set(playerShip.position.x * 0.75, 2.2, playerShip.position.z + 5.0);
        camera.lookAt(new THREE.Vector3(playerShip.position.x, 0.6, playerShip.position.z - 10));
        renderer.render(scene, camera);
    }

    function startGame(event) {
        if(event) event.stopPropagation();
        initAudio();
        
        // Audio transition: halt menu track, bring up runtime gameplay track
        startingMusic.pause();
        if (!isMuted) {
            gameplayMusic.play().catch(e => console.error("Gameplay audio blocked:", e));
        }
        
        document.getElementById("menuScreen").style.display = "none";
        gameRunning = true;
        spawnIntervalId = setInterval(spawnEntity, 650);
    }

    function handleGameOver() {
        gameRunning = false;
        clearInterval(spawnIntervalId);
        gameplayMusic.pause();
        playSynthSound('crash');
        document.getElementById("gameOverScreen").style.display = "flex";
        if (gameScore > highScore) { localStorage.setItem("dewiseHighScore", gameScore); }
    }

    function restartGame() { location.reload(); }
    function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

    init();
</script>
</body>
</html>
