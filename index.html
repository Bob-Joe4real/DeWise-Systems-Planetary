<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DeWise Systems PLANETARY</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a3a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DeWise Planetary">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        :root {
            --neon-cyan: #00f3ff;
            --neon-gold: #ffdf00;
            --neon-magenta: #ff00ff;
            --neon-red: #ff3333;
            --bg-space: #060616;
            --glass-bg: rgba(10, 10, 35, 0.6);
            --glass-border: rgba(0, 243, 255, 0.25);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-space);
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* --- IMMUTABLE TOP LAYER AUDIO TOGGLE --- */
        #audioToggleBtn {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            right: max(20px, env(safe-area-inset-right));
            z-index: 999999 !important;
            background: #00f3ff !important;
            color: #000000 !important;
            border: 3px solid #ffffff !important;
            padding: 10px 18px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 25px #00f3ff;
            transition: all 0.2s ease;
            pointer-events: auto !important;
        }

        @media (min-width: 768px) {
            #audioToggleBtn { padding: 14px 24px; font-size: 14px; gap: 10px; }
        }

        /* --- SCREEN OVERLAYS WITH GLASSMORPHISM --- */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: #ffffff;
            z-index: 1000;
            background: radial-gradient(circle at center, rgba(6, 6, 22, 0.4) 0%, rgba(6, 6, 22, 0.85) 100%);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* --- ADVANCED KINETIC TEXT ANIMATIONS --- */
        .brand-title {
            font-size: clamp(1.4rem, 5vw, 2.5rem);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
            font-weight: 900;
            margin-bottom: 5px;
            animation: textGlowPulse 3s ease-in-out infinite alternate;
        }

        .brand-subtitle {
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 900;
            letter-spacing: 12px;
            margin: 0 0 40px 0;
            text-transform: uppercase;
            color: var(--neon-cyan);
            position: relative;
            animation: subTitleScaleBreathe 4s ease-in-out infinite alternate, cosmicColorShift 8s linear infinite;
        }

        @keyframes textGlowPulse {
            0% { text-shadow: 0 0 10px rgba(255,255,255,0.3), 0 0 20px rgba(0,243,255,0.2); transform: translateY(0px); }
            100% { text-shadow: 0 0 20px rgba(255,255,255,0.6), 0 0 40px rgba(0,243,255,0.5); transform: translateY(-4px); }
        }

        @keyframes subTitleScaleBreathe {
            0% { transform: scale(0.96); letter-spacing: 10px; filter: drop-shadow(0 0 15px rgba(0,243,255,0.4)); }
            100% { transform: scale(1.03); letter-spacing: 14px; filter: drop-shadow(0 0 35px rgba(0,243,255,0.9)); }
        }

        @keyframes cosmicColorShift {
            0%, 100% { color: var(--neon-cyan); }
            50% { color: var(--neon-magenta); }
        }

        .btn-modern {
            padding: clamp(14px, 3vw, 18px) clamp(35px, 8vw, 50px);
            font-size: clamp(14px, 2.5vw, 16px);
            font-weight: 700;
            letter-spacing: 3px;
            background: var(--glass-bg);
            color: #fff;
            border: 2px solid var(--glass-border);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-modern:hover {
            border-color: var(--neon-cyan);
            background: rgba(0, 243, 255, 0.15);
            box-shadow: 0 0 35px rgba(0, 243, 255, 0.6);
            transform: translateY(-3px) scale(1.03);
            color: #fff;
        }

        /* --- HUD VIEWPORT --- */
        #hud {
            position: absolute;
            top: max(20px, env(safe-area-inset-top));
            left: max(20px, env(safe-area-inset-left));
            background: var(--glass-bg);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #e0e0ff;
            font-family: monospace;
            font-size: clamp(11px, 2vw, 14px);
            z-index: 10;
            pointer-events: none;
            line-height: 1.6;
            display: none;
        }

        .hud-val { color: #fff; font-weight: bold; }

        #gameAlert {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Segoe UI', sans-serif;
            font-size: clamp(20px, 5vw, 32px);
            font-weight: 900;
            letter-spacing: 2px;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            transition: all 0.2s ease;
            text-align: center;
        }

        /* --- MOBILITY TOUCH CHANNELS --- */
        .control-container {
            position: absolute;
            bottom: max(25px, env(safe-area-inset-bottom));
            left: 0;
            width: 100%;
            padding: 0 max(25px, env(safe-area-inset-left)) 0 max(25px, env(safe-area-inset-right));
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            pointer-events: none;
            z-index: 20;
            display: none;
        }

        .hud-dir-btn {
            width: clamp(65px, 18vw, 85px);
            height: clamp(65px, 18vw, 85px);
            border-radius: 50%;
            background: var(--glass-bg);
            border: 2px solid var(--glass-border);
            color: var(--neon-cyan);
            cursor: pointer;
            pointer-events: auto;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
        }

        .hud-dir-btn svg { width: 45%; height: 45%; }
        .hud-dir-btn:active {
            border-color: #ffffff;
            background: rgba(0, 243, 255, 0.3);
            transform: scale(0.9);
        }

        #iosPrompt {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 40px);
            max-width: 360px;
            background: rgba(15, 15, 40, 0.95);
            border: 2px solid var(--neon-cyan);
            border-radius: 20px;
            padding: 20px;
            box-sizing: border-box;
            color: #ffffff;
            z-index: 100000;
            box-shadow: 0 10px 40px rgba(0, 243, 255, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        #iosPrompt h3 { margin: 0 0 10px 0; color: var(--neon-cyan); font-size: 16px; }
        #iosPrompt p { margin: 0; font-size: 13px; line-height: 1.5; color: #d0d0f0; }
        #iosPrompt .close-prompt { position: absolute; top: 10px; right: 15px; color: #ff3333; font-weight: bold; cursor: pointer; }

        #gameOverScreen { display: none; }
    </style>
</head>

    <body>

    <button id="audioToggleBtn" onclick="toggleMute(event)">
        <span id="audioIcon">🔊</span> <span id="audioText">SOUND: ON</span>
    </button>

    <div id="menuScreen" class="screen-overlay" onclick="handleMenuInteraction()">
        <div class="brand-title">DeWise Systems</div>
        <div class="brand-subtitle">PLANETARY</div>
        <button class="btn-modern" onclick="startGame(event)">LAUNCH ENGINE</button>
    </div>

    <div id="hud">
        <span style="color:var(--neon-cyan)">⚡ DE-WISE ADVANCED AERO OS v9.0</span><br>
        Score: <span id="score" class="hud-val">0</span><br>
        Velocity: <span id="speed" class="hud-val">0</span> km/s<br>
        Record: <span id="highScore" class="hud-val">0</span>
    </div>

    <div id="gameAlert"></div>

    <div class="control-container" id="controlPanel">
        <button id="leftBtn" class="hud-dir-btn" aria-label="Steer Left">
            <svg viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
        </button>
        <button id="rightBtn" class="hud-dir-btn" aria-label="Steer Right">
            <svg viewBox="0 0 24 24" fill="none" stroke="#00f3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
            </svg>
        </button>
    </div>

    <div id="gameOverScreen" class="screen-overlay">
        <div class="brand-title" style="color: var(--neon-red)">System Alert</div>
        <h1 style="text-shadow: 0 0 30px rgba(255, 51, 51, 0.4); font-size: 2.2rem;">CRITICAL COLLISION</h1>
        <button class="btn-modern" style="border-color: var(--neon-red);" onclick="restartGame()">RE-MATERIALIZE</button>
    </div>

    <div id="iosPrompt">
        <span class="close-prompt" onclick="document.getElementById('iosPrompt').style.display='none'">✕</span>
        <h3>Install DeWise Planetary</h3>
        <p>Tap the <strong>Share</strong> icon in Safari, then select <strong>"Add to Home Screen"</strong> to run directly as a full-screen app.</p>
    </div>

<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('PWA Connected.'))
                .catch(err => console.error('PWA Engine failure.', err));
        });
    }

    document.addEventListener("DOMContentLoaded", () => {
        const isIos = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isStandalone = window.navigator.standalone === true;
        if (isIos && !isStandalone) {
            document.getElementById('iosPrompt').style.display = 'block';
        }
    });

    let scene, camera, renderer, playerShip, menuGalaxyGroup;
    let gameRunning = false;
    let speed = 0.25;
    const baseSpeed = 0.25;
    let gameScore = 0;
    let highScore = Number(localStorage.getItem("dewiseHighScore")) || 0;
    let gameObjects = [];
    const lanes = [-2.5, 0, 2.5];
    let moveLeft = false, moveRight = false;
    let spawnIntervalId;
    let cinematicTime = 0;

    // --- STUNT & PHYSICS EXTRACTION COEFFICIENTS ---
    let TargetRollRotation = 0;
    let CurrentRollRotation = 0;

    // --- AUDIO SYSTEM LAYER ---
    let isMuted = false;
    let audioCtx = null;
    let audioInitialized = false;

    const startingMusic = new Audio('starting.mp3');
    const gameplayMusic = new Audio('theme.wav');
    startingMusic.loop = true;
    gameplayMusic.loop = true;

    function initAudio() {
        if (audioInitialized) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioInitialized = true;
    }

    function handleMenuInteraction() {
        initAudio();
        if (!gameRunning && startingMusic.paused && !isMuted) {
            startingMusic.play().catch(e => console.log("Audio waiting on interaction."));
        }
    }

    function playSynthSound(type) {
        if (isMuted || !audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        
        if (type === 'booster') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.15);
        } 
        else if (type === 'reducer') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.25);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.25);
        } 
        else if (type === 'crash') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.linearRampToValueAtTime(40, now + 0.5);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(now); osc.stop(now + 0.5);
        }
    }

    function toggleMute(event) {
        if(event) event.stopPropagation();
        initAudio();
        isMuted = !isMuted;
        startingMusic.muted = isMuted;
        gameplayMusic.muted = isMuted;
        
        const btn = document.getElementById("audioToggleBtn");
        const icon = document.getElementById("audioIcon");
        const text = document.getElementById("audioText");
        
        if (isMuted) {
            icon.innerText = "✕"; text.innerText = "SOUND: MUTED";
            btn.style.setProperty("background", "#ff3333", "important");
            btn.style.setProperty("box-shadow", "0 0 30px #ff3333", "important");
        } else {
            icon.innerText = "🔊"; text.innerText = "SOUND: ON";
            btn.style.setProperty("background", "#00f3ff", "important");
            btn.style.setProperty("box-shadow", "0 0 30px #00f3ff", "important");
            if (gameRunning) gameplayMusic.play().catch(()=>{});
            else startingMusic.play().catch(()=>{});
        }
    }

    function triggerAlert(text, color) {
        const alertDiv = document.getElementById("gameAlert");
        alertDiv.innerText = text; alertDiv.style.color = color;
        alertDiv.style.textShadow = `0 0 15px ${color}`; alertDiv.style.opacity = "1";
        setTimeout(() => { alertDiv.style.opacity = "0"; }, 800);
    }

    // --- REAL AIRCRAFT MODEL BUILDER ENGINE ---
    function buildAdvancedAircraft() {
        const aircraftGroup = new THREE.Group();

        // Fuselage Main Frame
        const bodyGeo = new THREE.CylinderGeometry(0.18, 0.22, 1.8, 8);
        bodyGeo.rotateX(Math.PI / 2);
        const titaniumMat = new THREE.MeshStandardMaterial({ color: 0xddddf5, metalness: 0.85, roughness: 0.15 });
        const fuselage = new THREE.Mesh(bodyGeo, titaniumMat);
        aircraftGroup.add(fuselage);

        // Pointy Cockpit Nose Cone
        const noseGeo = new THREE.ConeGeometry(0.18, 0.7, 8);
        noseGeo.rotateX(Math.PI / 2);
        const darkChromeMat = new THREE.MeshStandardMaterial({ color: 0x112233, metalness: 0.9, roughness: 0.05 });
        const nose = new THREE.Mesh(noseGeo, darkChromeMat);
        nose.position.set(0, 0, -1.25); // Forward displacement
        aircraftGroup.add(nose);

        // Sweep-Back Aero Delta Wings
        const wingShape = new THREE.Shape();
        wingShape.moveTo(0, 0);
        wingShape.lineTo(1.8, -0.9);   // Wingtip displacement
        wingShape.lineTo(0.4, -1.2);   // Rear return profile
        wingShape.lineTo(0, -0.4);

        const wingExtrudeSettings = { depth: 0.04, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.02, bevelThickness: 0.02 };
        const wingGeo = new THREE.ExtrudeGeometry(wingShape, wingExtrudeSettings);
        wingGeo.rotateX(Math.PI / 2);
        wingGeo.center();

        const neonMat = new THREE.MeshStandardMaterial({ color: 0x00f3ff, emissive: 0x003355, metalness: 0.7 });
        
        const leftWing = new THREE.Mesh(wingGeo, neonMat);
        leftWing.position.set(-0.9, -0.05, 0.1);
        leftWing.scale.set(-1, 1, 1); // Flip geometry along X-axis
        aircraftGroup.add(leftWing);

        const rightWing = new THREE.Mesh(wingGeo, neonMat);
        rightWing.position.set(0.9, -0.05, 0.1);
        aircraftGroup.add(rightWing);

        // Vertical Stabilizer Tail Fin
        const finShape = new THREE.Shape();
        finShape.moveTo(0, 0);
        finShape.lineTo(0, 0.6);
        finShape.lineTo(-0.4, 0.4);
        finShape.lineTo(-0.5, 0);
        const finGeo = new THREE.ExtrudeGeometry(finShape, wingExtrudeSettings);
        finGeo.center();
        const fin = new THREE.Mesh(finGeo, titaniumMat);
        fin.position.set(0, 0.35, 0.6);
        aircraftGroup.add(fin);

        // Twin Thruster Afterburners
        const engineGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.3, 8);
        engineGeo.rotateX(Math.PI / 2);
        const engineMat = new THREE.MeshStandardMaterial({ color: 0x333344, metalness: 0.9 });
        const glowMat = new THREE.MeshStandardMaterial({ color: 0xffdf00, emissive: 0xff5500 });

        const leftEngine = new THREE.Mesh(engineGeo, engineMat);
        leftEngine.position.set(-0.1, 0, 0.9);
        aircraftGroup.add(leftEngine);

        const rightEngine = new THREE.Mesh(engineGeo, engineMat);
        rightEngine.position.set(0.1, 0, 0.9);
        aircraftGroup.add(rightEngine);

        // Visual exhaust flare indicators
        const flareGeo = new THREE.ConeGeometry(0.06, 0.25, 6);
        flareGeo.rotateX(-Math.PI / 2);
        const leftFlare = new THREE.Mesh(flareGeo, glowMat);
        leftFlare.position.set(-0.1, 0, 1.05);
        aircraftGroup.add(leftFlare);

        const rightFlare = new THREE.Mesh(flareGeo, glowMat);
        rightFlare.position.set(0.1, 0, 1.05);
        aircraftGroup.add(rightFlare);

        return aircraftGroup;
    }

    // --- CORE THREE.JS INITIALIZATION LAYER ---
    function init() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050512);
        scene.fog = new THREE.FogExp2(0x050512, 0.012);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0x7777aa));
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
        keyLight.position.set(5, 25, 15);
        scene.add(keyLight);

        // Generate and append the advanced real model composition
        playerShip = buildAdvancedAircraft();
        playerShip.position.set(0, 0.5, 0);
        scene.add(playerShip);

        // Core Space Stars System
        const starsGeo = new THREE.BufferGeometry();
        const starPositions = new Float32Array(400 * 3);
        for(let i=0; i<400*3; i+=3) {
            starPositions[i] = (Math.random() - 0.5) * 160;
            starPositions[i+1] = (Math.random() - 0.5) * 160;
            starPositions[i+2] = (Math.random() - 0.5) * 250;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMat = new THREE.PointsMaterial({color: 0xffffff, size: 0.45});
        scene.add(new THREE.Points(starsGeo, starsMat));

        // --- SPLASH SCREEN GRAPHICS ANIMATION LAYER ---
        menuGalaxyGroup = new THREE.Group();
        
        const menuPlanetGeo = new THREE.SphereGeometry(3.5, 32, 32);
        const menuPlanetMat = new THREE.MeshStandardMaterial({ color: 0xaa33ff, roughness: 0.8, metalness: 0.2 });
        const menuPlanet = new THREE.Mesh(menuPlanetGeo, menuPlanetMat);
        menuPlanet.position.set(-8, 2, -25);
        menuGalaxyGroup.add(menuPlanet);

        const menuPlanetGeo2 = new THREE.SphereGeometry(2.0, 24, 24);
        const menuPlanetMat2 = new THREE.MeshStandardMaterial({ color: 0xff5500, roughness: 0.5 });
        const menuPlanet2 = new THREE.Mesh(menuPlanetGeo2, menuPlanetMat2);
        menuPlanet2.position.set(9, -3, -30);
        menuGalaxyGroup.add(menuPlanet2);

        const galaxyDustGeo = new THREE.BufferGeometry();
        const dustPositions = new Float32Array(150 * 3);
        for(let i=0; i<150*3; i+=3) {
            dustPositions[i] = (Math.random() - 0.5) * 40;
            dustPositions[i+1] = (Math.random() - 0.5) * 40;
            dustPositions[i+2] = (Math.random() - 0.5) * 40 - 20;
        }
        galaxyDustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
        const dustMat = new THREE.PointsMaterial({color: 0x00f3ff, size: 0.6, transparent: true, opacity: 0.8});
        const galaxyDust = new THREE.Points(galaxyDustGeo, dustMat);
        menuGalaxyGroup.add(galaxyDust);

        scene.add(menuGalaxyGroup);

        document.getElementById("highScore").innerText = highScore;
        setupControls();
        window.addEventListener("resize", onResize);
        animate();
    }

    function setupControls() {
        const leftBtn = document.getElementById("leftBtn"), rightBtn = document.getElementById("rightBtn");
        
        leftBtn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); moveLeft = true; TargetRollRotation = Math.PI * 2; });
        leftBtn.addEventListener("touchend", (e) => { e.preventDefault(); moveLeft = false; });
        rightBtn.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); moveRight = true; TargetRollRotation = -Math.PI * 2; });
        rightBtn.addEventListener("touchend", (e) => { e.preventDefault(); moveRight = false; });
        
        document.addEventListener("keydown", (e) => {
            initAudio();
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") { moveLeft = true; TargetRollRotation = Math.PI * 2; }
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") { moveRight = true; TargetRollRotation = -Math.PI * 2; }
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") moveLeft = false;
            if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") moveRight = false;
        });
    }

    function spawnEntity() {
        if (!gameRunning) return;
        const randType = Math.random();
        let objGeo, objMat, typeName, size = 0.4;

        if (randType < 0.45) {
            typeName = "planet"; size = 0.6 + Math.random() * 0.6;
            objGeo = new THREE.SphereGeometry(size, 16, 16);
            objMat = new THREE.MeshStandardMaterial({ color: 0xff5733, roughness: 0.7 });
        } else if (randType < 0.75) {
            typeName = "booster"; size = 0.3;
            objGeo = new THREE.OctahedronGeometry(size, 0);
            objMat = new THREE.MeshStandardMaterial({ color: 0xffdf00, metalness: 0.9, emissive: 0x443300 });
        } else {
            typeName = "reducer"; size = 0.3;
            objGeo = new THREE.BoxGeometry(size, size, size);
            objMat = new THREE.MeshStandardMaterial({ color: 0xff00ff, metalness: 0.5, emissive: 0x330033 });
        }

        const mesh = new THREE.Mesh(objGeo, objMat);
        mesh.position.set(lanes[Math.floor(Math.random() * 3)], 0.5, playerShip.position.z - 75);
        mesh.userData = { type: typeName, radius: size, rotSpeed: 0.03 };
        scene.add(mesh);
        gameObjects.push(mesh);
    }

    function animate() {
        requestAnimationFrame(animate);
        
        if (gameRunning) {
            playerShip.position.z -= speed;
            speed += 0.00002;

            gameScore = Math.floor(Math.abs(playerShip.position.z) * 0.5);
            document.getElementById("score").innerText = gameScore;
            document.getElementById("speed").innerText = Math.floor(speed * 320);

            if (moveLeft && playerShip.position.x > -2.6) playerShip.position.x -= 0.18;
            if (moveRight && playerShip.position.x < 2.6) playerShip.position.x += 0.18;

            // --- SMOOTH BARREL ROLL INTERPOLATION ---
            if (TargetRollRotation !== 0) {
                // Advance step increment smoothly
                const step = (TargetRollRotation > 0) ? 0.22 : -0.22;
                CurrentRollRotation += step;
                
                // Track complete full cycle loop rotation closure
                if (Math.abs(CurrentRollRotation) >= Math.PI * 2) {
                    CurrentRollRotation = 0;
                    TargetRollRotation = 0;
                }
            }
            playerShip.rotation.z = CurrentRollRotation;

            for (let i = gameObjects.length - 1; i >= 0; i--) {
                let obj = gameObjects[i];
                obj.rotation.y += obj.userData.rotSpeed;
                obj.rotation.x += 0.01;
                
                if (obj.position.z > playerShip.position.z + 10) { 
                    scene.remove(obj); gameObjects.splice(i, 1); continue; 
                }
                
                if (playerShip.position.distanceTo(obj.position) < (obj.userData.radius + 0.6)) {
                    if (obj.userData.type === "planet") { handleGameOver(); return; }
                    else if (obj.userData.type === "booster") {
                        speed = Math.min(speed + 0.08, 0.8);
                        playSynthSound('booster');
                        triggerAlert("BOOST! SPEED UP", "var(--neon-gold)");
                    } else if (obj.userData.type === "reducer") {
                        speed = Math.max(speed - 0.06, baseSpeed);
                        playSynthSound('reducer');
                        triggerAlert("REDUCER! VELOCITY DROP", "var(--neon-magenta)");
                    }
                    scene.remove(obj); gameObjects.splice(i, 1);
                }
            }

            camera.position.set(playerShip.position.x * 0.75, 2.2, playerShip.position.z + 5.0);
            camera.lookAt(new THREE.Vector3(playerShip.position.x, 0.6, playerShip.position.z - 10));

        } else {
            // --- MENU VIEW DRIFTING SIMULATION ---
            cinematicTime += 0.003;
            if(menuGalaxyGroup) {
                menuGalaxyGroup.rotation.y += 0.002;
                menuGalaxyGroup.rotation.x = Math.sin(cinematicTime * 0.5) * 0.05;
            }

            playerShip.position.x = Math.sin(cinematicTime * 2) * 1.5;
            playerShip.position.y = 0.5 + Math.cos(cinematicTime * 3) * 0.4;
            playerShip.rotation.y += 0.015;
            playerShip.rotation.z = Math.sin(cinematicTime * 2) * 0.2;

            camera.position.x = Math.sin(cinematicTime) * 6;
            camera.position.y = 3.5 + Math.cos(cinematicTime) * 1.5;
            camera.position.z = 8.0;
            camera.lookAt(new THREE.Vector3(0, 0.5, -5));
        }
        
        renderer.render(scene, camera);
    }

    function startGame(event) {
        if(event) event.stopPropagation();
        initAudio();
        
        startingMusic.pause();
        if (!isMuted) {
            gameplayMusic.play().catch(e => console.error("Audio pipeline block:", e));
        }

        if(menuGalaxyGroup) { scene.remove(menuGalaxyGroup); }

        // Secure baseline positioning for race launch
        playerShip.position.set(0, 0.5, 0);
        playerShip.rotation.set(0, 0, 0);
        CurrentRollRotation = 0;
        TargetRollRotation = 0;

        document.getElementById("menuScreen").style.opacity = "0";
        setTimeout(() => {
            document.getElementById("menuScreen").style.display = "none";
            document.getElementById("hud").style.display = "block";
            document.getElementById("controlPanel").style.display = "flex";
            gameRunning = true;
            spawnIntervalId = setInterval(spawnEntity, 650);
        }, 600);
    }

    function handleGameOver() {
        gameRunning = false;
        clearInterval(spawnIntervalId);
        gameplayMusic.pause();
        playSynthSound('crash');
        document.getElementById("gameOverScreen").style.display = "flex";
        if (gameScore > highScore) { localStorage.setItem("dewiseHighScore", gameScore); }
    }

    function restartGame() { location.reload(); }
    function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

    init();
</script>
</body>
</html>
